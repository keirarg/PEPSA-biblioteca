version: '3'
services:
  mariadb:
    image: mariadb
    container_name: mariadba1
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: PEPSA
    volumes:
      - ./mariadb_data:/var/lib/mysql:rw
      - ./Biblioteca.sql:/docker-entrypoint-initdb.d/Biblioteca.sql:ro
    user: mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmina1
    restart: always
    environment:
      - PMA_HOST=mariadb
    ports:
      - 7001:80
    depends_on:
      - mariadb
    networks:
      - backend

  python:
    build: .
    container_name: pythona1
    environment:
      PYTHONUNBUFFERED: 1
      DB_USERNAME: root
      DB_PASSWORD: example
      DB_DATABASE: PEPSA
      DB_HOST: mariadb
      DB_PORT: 3306
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      - 9094:8080
    depends_on:
      - mariadb
    networks:
      - backend

  apache:
    build: ./apache
    container_name: apachea1
    ports:
      - 6001:80
    volumes:
      - ./apache/static:/var/www/html
    networks:
      - backend

networks:
  backend:
    driver: bridge


    
    