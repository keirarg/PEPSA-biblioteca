<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJEMPLO APP apache CON CRUD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">
    <script>
        var myHeaders = new Headers();
        myHeaders.append("Content-Type", "application/json");

        function guardar(){
            let titulo=document.getElementById("titulo").value;
            let autor=document.getElementById("autor").value;
            let anio =document.getElementById("anio").value;
            let precio=document.getElementById("precio").value;
            let foto=document.getElementById("foto").value;
            let datos=JSON.stringify({
                "titulo":titulo,
                "autor":autor,
                "anio":anio,
                "precio":precio,
                "foto":foto
            });
            var requestOptions = {
                method: 'POST',
                headers: myHeaders,
                body: datos
            };

            fetch("/api/libros", requestOptions)
                .then(response => response.json())
                .then(result => {
                    if (result.status == "OK"){
                        alert("Libro guardado")
                        location.href="libros.html"
                    } else {
                        alert("El libro no ha podido ser guardado")
                    }
                })
                .catch(error => {
                    console.log('error', error);
                    alert("Se ha producido un error y el libro no ha podido ser guardado")
                });
        }
    </script>
</head>
<body>
    <nav class="navbar is-warning" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <button class="navbar-burger is-warning button" aria-label="menu" aria-expanded="false"
                data-target="navbarBasicExample">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>
        </div>
        <div class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="libros.html">Libros</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                </div>
            </div>
        </div>
    </nav>
  <section class="section">
    <div class="columns">
        <div class="column">
            <h3 class="is-size-3">Agregar libro</h3>
                <label for="titulo">Titulo:</label>
                <input required type="text" class="input" placeholder="Titulo" name="titulo" id="titulo">
                <label for="autor">Autor</label>
                <input required type="text" class="input" placeholder="Autor" name="autor" id="autor">
                <label for="anio">Año</label>
                <input required type="number" class="input" placeholder="Año" name="anio" id="anio">
                <label for="precio">Precio</label>
                <input required type="number" class="input" placeholder="Precio" name="precio" id="precio">
                <label for="foto">Foto</label>
                <input required type="file" class="input" placeholder="Foto" name="foto" id="foto">
                <button type="button" onclick="guardar()" class="button is-success mt-2">Guardar</button>
                <a href="libros.html" class="button is-primary mt-2">Volver</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
